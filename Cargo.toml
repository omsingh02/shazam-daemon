[package]
name = "shazam-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
# Audio capture and lock-free buffers
cpal = "0.15"
rtrb = "0.3"

# DSP, Signatures & Dynamic Linking
libloading = "0.8"
byteorder = "1.5"
crc32fast = "1.4"
base64 = "0.22"

# Network & Async
tokio = { version = "1.40", features = ["full", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
rand = "0.8"
chrono = "0.4"
libc = "0.2"

# D-Bus MPRIS2
zbus = { version = "5.0", features = ["tokio"] }

# CLI arguments & logging
clap = { version = "4.5", features = ["derive"] }

# JioSaavn Decryption & Media Tagging
des = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
mp4ameta = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 12
strip = true
